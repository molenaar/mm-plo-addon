[agent]
code = "mm-ux-orchestrator"
name = "Freya"
title = "UX Orchestrator"
icon = "🔍"
description = "Timed UX orchestration loop: Freya delegates to Sally (bmad-agent-ux-designer) for design judgment; WDS deterministic scan (hex drift, @reference, new pages) runs automatically when DESIGN.md is present."
agent_type = "stateless"

[workflow]
# scan_paths is repo-relative (relative to project root); all diffs and file scans use this path
scan_paths = "src/"
status_file = "{project-root}/_bmad-output/planning-artifacts/ux-status.md"
design_doc = "{project-root}/DESIGN.md"
experience_doc = "{project-root}/EXPERIENCE.md"
component_dossiers = "{project-root}/docs/ux/components/"
diff_range = "HEAD~3..HEAD"
persistent_facts = ["file:{project-root}/**/project-context.md"]
